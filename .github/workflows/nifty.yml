name: Nifty 50 movers
on:
  workflow_dispatch:   # triggered by cron-job.org (GitHub's own cron is too late)
    inputs:
      mode:
        description: "full = 9:15 report; alert = hourly new-setup alerts only"
        required: false
        default: "full"
      force:
        description: "true = ignore the 09:10-16:00 weekday window (for tests)"
        required: false
        default: "false"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Time window (09:10-16:00 IST, Mon-Fri)
        id: win
        env:
          FORCE: ${{ inputs.force }}
        run: |
          hm=$((10#$(TZ=Asia/Kolkata date +%H%M)))
          dow=$(TZ=Asia/Kolkata date +%u)
          if [ "$FORCE" = "true" ] || { [ "$dow" -le 5 ] && [ "$hm" -ge 910 ] && [ "$hm" -le 1600 ]; }; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Outside the 09:10-16:00 IST weekday window - nothing is sent."
          fi
      - if: steps.win.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.win.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.win.outputs.ok == 'true'
        run: pip install -r requirements.txt
      - name: Morning report (Nifty 50 direction + Nifty 100 trading + Elliott)
        if: steps.win.outputs.ok == 'true' && inputs.mode != 'alert'
        run: python report.py ${{ inputs.force == 'true' && '--force' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      - name: Hourly Elliott alert (new setups only)
        if: steps.win.outputs.ok == 'true' && inputs.mode == 'alert'
        run: python ew_alert.py ${{ inputs.force == 'true' && '--force' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
